<html lang="pl">
<head>

    <title>Frontend tasks</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #e9eb8a, #eff0bb);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: #ffffff;
            padding: 40px;

            width: 300px;
        }

        h1 {
            margin-bottom: 25px;
            color: #333;
        }

        .button {
            display: block;
            margin: 10px 0;
            padding: 12px;
            background: #d8db37;
            color: #1f2d3d;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.2s;
        }

        .button:hover {
            background: #c6c918;
        }
    </style>
</head>

<div class="container">
    <h1>Choose task</h1>
